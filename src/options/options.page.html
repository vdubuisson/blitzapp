<main class="container">
  <button
    class="btn light"
    (click)="clearStores()"
    data-testid="clear-button"
  >
    Vider le stockage de partie
  </button>
  <p class="info">
    En cas de problème avec une partie en cours, ceci permet de réinitialiser les données stockées au cours d'une partie pour repartir à zéro.
  </p>
</main>
