<div class="modal">
  <header>
    @if (data.header) {
      <span class="modal-title">{{ data.header }}</span>
    }
    <fa-icon
      class="close-icon"
      [icon]="closeIcon"
      (click)="close()"
      size="xl"
      data-testid="close-icon"
    />
  </header>
  <div class="modal-body">
    <input
      class="form-control"
      type="text"
      [(ngModel)]="formValue"
      (keydown.enter)="close(true)"
      data-testid="text-input"
    />
  </div>
  <footer>
    <button
      class="btn primary"
      (click)="close(true)"
      data-testid="confirm-button"
    >
      VALIDER
    </button>
  </footer>
</div>
