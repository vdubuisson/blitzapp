<cdk-accordion>
  @for (role of roles; track role) {
  <lgmj-accordion-item [noIndicatorMargin]="true" data-testid="accordion-item">
    <ng-container header>
      <img
        [ngSrc]="role | playerRoleImage"
        [alt]="role | playerRoleName"
        [width]="55"
        [height]="55"
        class="role-img"
      />
      <span class="role-name">{{ role | playerRoleName }}</span>
      <fa-icon
        class="expand-icon"
        [icon]="expandIcon"
        (click)="showRoleCard(role, $event)"
        data-testid="expand-btn"
      />
    </ng-container>
    <span class="rule" [innerText]="rules[role]"></span>
  </lgmj-accordion-item>
  }
</cdk-accordion>
